<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  
  <style>
    body {
      margin: 0; padding: 10px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh; background-color: white;
      font-family: sans-serif;
    }
    #content {
      display: flex; flex-direction: column;
      align-items: center; text-align: center;
    }
    #tag-label {
      margin-top: 15px;
      font-weight: bold;
      font-size: 1.4rem; /* Larger for easy reading */
      color: black;
    }
  </style>
</head>
<body>

<div id="content"></div>

<script>
  function generateQRCode(qrData) {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const size = 0.75 * Math.min(vw, vh); 
    
    const canvas = document.createElement('canvas');
    new QRious({
      element: canvas,
      level: 'H',
      size: size,
      value: qrData || ""
    });
    return canvas;
  }

  grist.ready({
    columns: [
      { name: "Link", title: "QR Link" },
      { name: "Tag", title: "Asset Tag" }
    ],
    requiredAccess: 'read table'
  });

  grist.onRecord(function(record) {
    const content = document.getElementById('content');
    
    function update_view() {
      content.innerHTML = '';
      
      // 1. QR Code
      content.appendChild(generateQRCode(record.Link));

      // 2. Asset Tag Logic (Handling Reference Columns)
      let displayTag = "";
      if (record.Tag) {
        displayTag = (typeof record.Tag === 'object') 
                     ? record.Tag.label || Object.values(record.Tag)[0] 
                     : record.Tag;
      }

      // 3. Render Tag below QR
      const label = document.createElement('div');
      label.id = 'tag-label';
      label.innerText = displayTag;
      content.appendChild(label);
    }

    window.addEventListener("resize", update_view);
    update_view();
  });
</script>

</body>
</html>
