<script>
  function qrcode (qr) {
    const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0)
    const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0)
    const size = .92 * Math.min(vw, vh)
    const canvas = document.createElement('canvas');
    new QRious ({
      element: canvas,
      level: 'L',
      size,
      value: qr
    });
    return canvas;
  }

  grist.ready({
    columns: ['Asset Type', 'Asset Tag'],
    requiredAccess: 'read table'
  });

  grist.onRecord(function(record) {
    const content = document.getElementById('content');

    const { 'Asset Type': assetType, 'Asset Tag': assetTag } = grist.mapColumnNames(record);

    function update_qr () {
      content.innerHTML = '';

      const combined = `${assetType}-${assetTag}`;

      content.appendChild(qrcode(combined));
    };

    window.addEventListener("resize", update_qr);
    update_qr();
  });
</script>
