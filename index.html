<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    body { 
      margin: 0; padding: 0; background: white; 
      display: flex; flex-direction: column; 
      align-items: center; justify-content: center; 
      height: 100vh; font-family: sans-serif; 
    }
    #tag { 
      margin-top: 15px; font-weight: bold; 
      font-size: 1.6rem; color: black; text-align: center;
    }
    canvas { max-width: 80%; height: auto; }
  </style>
</head>
<body>
  <canvas id="qr"></canvas>
  <div id="tag">Waiting for Mapping...</div>

<script>
  const qr = new QRious({ element: document.getElementById('qr'), level: 'H' });

  grist.ready({
    columns: [
      { name: "Link", title: "QR Link" },
      { name: "Tag", title: "Asset Tag" }
    ],
    requiredAccess: 'read table'
  });

  grist.onRecord(function(record) {
    const tagDiv = document.getElementById('tag');
    const size = Math.min(window.innerWidth, window.innerHeight) * 0.7;
    qr.size = size;
    qr.value = record.Link || "";

    let val = record.Tag;
    if (val && typeof val === 'object') {
      val = val.label || Object.values(val)[0] || String(val);
    }
    tagDiv.innerText = val || "Map Column in Right Panel";
  });
</script>
</body>
</html>
