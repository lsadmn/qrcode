<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    body { 
      margin: 0; padding: 0; background: white; 
      display: flex; flex-direction: column; 
      align-items: center; justify-content: center; 
      height: 100vh; font-family: sans-serif; 
    }
    #container { display: flex; flex-direction: column; align-items: center; }
    #tag { margin-top: 10px; font-weight: bold; font-size: 1.5rem; color: black; }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="qr"></canvas>
    <div id="tag"></div>
  </div>

<script>
  const qr = new QRious({ element: document.getElementById('qr'), level: 'H' });

  grist.ready({
    columns: [
      { name: "Link", title: "QR Link" },
      { name: "Tag", title: "Asset Tag" }
    ],
    requiredAccess: 'read table'
  });

  grist.onRecord(function(record) {
    // 1. Update QR Code
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    qr.size = 0.70 * Math.min(vw, vh);
    qr.value = record.Link || "";

    // 2. Update Tag Text
    const tagDiv = document.getElementById('tag');
    let val = record.Tag;
    
    // Simple fix for Reference Columns
    if (val && typeof val === 'object') {
      val = val.label || Object.values(val)[0];
    }
    
    tagDiv.innerText = val || "";
  });
</script>
</body>
</html>
