<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  
  <style>
    body {
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: white;
    }
    #content {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #label {
      margin-top: 15px;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 1.5rem; /* Larger text for readability */
      color: black;
      text-align: center;
    }
  </style>
</head>
<body>

<div id="content"></div>

<script>
  function generateQRCode(qrData) {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const size = 0.75 * Math.min(vw, vh);
    
    const canvas = document.createElement('canvas');
    new QRious({
      element: canvas,
      level: 'H', // High error correction for better scanning
      size: size,
      value: qrData || ""
    });
    return canvas;
  }

  // Define the columns the widget needs
  grist.ready({
    columns: [
      { name: "Link", title: "QR Link/Data", optional: false },
      { name: "Type", title: "Asset Type", optional: false },
      { name: "Brand", title: "Brand", optional: false }
    ],
    requiredAccess: 'read table'
  });

  grist.onRecord(function(record) {
    const content = document.getElementById('content');
    
    function update_view() {
      content.innerHTML = '';
      
      // Generate QR using the 'Link' column
      const qrCanvas = generateQRCode(record.Link);
      content.appendChild(qrCanvas);

      // Create Label: Type-Brand
      const label = document.createElement('div');
      label.id = 'label';
      label.innerText = `${record.Type}-${record.Brand}`;
      
      content.appendChild(label);
    }

    window.addEventListener("resize", update_view);
    update_view();
  });
</script>

</body>
</html>
