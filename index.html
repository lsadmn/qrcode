<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    body { 
      margin: 0; padding: 0; display: flex; flex-direction: column; 
      align-items: center; justify-content: center; height: 100vh; 
      font-family: sans-serif; background: white; overflow: hidden;
    }
    #label-wrap { 
      display: flex; flex-direction: column; align-items: center; 
      background: white; padding: 0; 
    }
    #tag { 
      margin-top: 0px; 
      font-weight: 900; /* Extra Bold */
      font-size: 2.8rem; /* Doubled size */
      text-align: center; color: black; line-height: 1;
      letter-spacing: -1px; /* Tighter letters for long serials */
    }
    canvas { display: block; }
    
    #controls { margin-top: 5px; }
    button { 
      padding: 4px 8px; cursor: pointer; background: #007bff; 
      color: white; border: none; border-radius: 3px; font-size: 0.7rem;
    }
    #status { font-size: 0.6rem; color: green; height: 1em; }
  </style>
</head>
<body>

  <div id="label-wrap">
    <canvas id="qr"></canvas>
    <div id="tag">...</div>
  </div>

  <div id="controls">
    <button onclick="copyLabel()">Copy Label</button>
  </div>
  <div id="status"></div>

<script>
  const qr = new QRious({ element: document.getElementById('qr'), level: 'H' });
  grist.ready({ requiredAccess: 'read table' });

  grist.onRecord(function(record) {
    // Fill the width as much as possible to leave room for the big text
    const size = Math.min(window.innerWidth, window.innerHeight) * 0.75;
    qr.size = size;
    qr.value = record.Link || record.QR_Link || "";
    
    let val = record.Tag;
    for (let key in record) {
      if (String(record[key]).includes("SN-")) { val = record[key]; break; }
    }
    document.getElementById('tag').innerText = val || "";
  });

  async function copyLabel() {
    const canvas = document.getElementById('qr');
    const tagText = document.getElementById('tag').innerText;
    const msg = document.getElementById('status');
    
    const offscreen = document.createElement('canvas');
    const ctx = offscreen.getContext('2d');
    
    // Create high-res canvas for crisp printing
    offscreen.width = canvas.width;
    offscreen.height = canvas.height + 60;
    
    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, offscreen.width, offscreen.height);
    ctx.drawImage(canvas, 0, 0);
    
    ctx.fillStyle = "black";
    ctx.font = "900 42px Arial"; // Huge font for the copied image
    ctx.textAlign = "center";
    ctx.fillText(tagText, offscreen.width / 2, canvas.height + 45);

    offscreen.toBlob(async (blob) => {
      try {
        const data = [new ClipboardItem({ "image/png": blob })];
        await navigator.clipboard.write(data);
        msg.innerText = "Copied!";
        setTimeout(() => msg.innerText = "", 1500);
      } catch (err) {
        msg.style.color = "red";
        msg.innerText = "Error";
      }
    });
  }
</script>
</body>
</html>
