<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    body { 
      margin: 0; padding: 0; background: white; 
      display: flex; flex-direction: column; 
      align-items: center; justify-content: center; 
      height: 100vh; font-family: sans-serif; 
    }
    #container { display: flex; flex-direction: column; align-items: center; width: 100%; }
    #tag { 
      margin-top: 15px; 
      font-weight: bold; 
      font-size: 1.6rem; 
      color: black; 
      min-height: 1.6em; /* Keeps space even if empty */
    }
    canvas { max-width: 90%; height: auto; }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="qr"></canvas>
    <div id="tag">Loading Tag...</div>
  </div>

<script>
  const qr = new QRious({ element: document.getElementById('qr'), level: 'H' });

  grist.ready({
    columns: [
      { name: "Link", title: "QR Link" },
      { name: "Tag", title: "Asset Tag" }
    ],
    requiredAccess: 'read table'
  });

  grist.onRecord(function(record) {
    const tagDiv = document.getElementById('tag');

    // 1. Update QR
    const size = Math.min(window.innerWidth, window.innerHeight) * 0.7;
    qr.size = size;
    qr.value = record.Link || "No Data";

    // 2. Robust Tag Extraction
    let rawVal = record.Tag;
    let finalLabel = "";

    if (rawVal !== null && rawVal !== undefined) {
      if (typeof rawVal === 'object') {
        // Handle Reference or complex formula objects
        finalLabel = rawVal.label || Object.values(rawVal)[0] || String(rawVal);
      } else {
        finalLabel = String(rawVal);
      }
    }

    tagDiv.innerText = finalLabel || "Waiting for Mapping...";
  });
</script>
</body>
</html>
