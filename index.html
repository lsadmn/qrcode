<script>
  function generateQRCode(qrData) {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const size = 0.75 * Math.min(vw, vh);
    
    const canvas = document.createElement('canvas');
    new QRious({
      element: canvas,
      level: 'H',
      size: size,
      value: qrData || ""
    });
    return canvas;
  }

  grist.ready({
    columns: [
      { name: "Link", title: "QR Link/Data", optional: false },
      { name: "Type", title: "Asset Type", optional: false }, // This is your Reference Column
      { name: "Brand", title: "Brand", optional: false }
    ],
    requiredAccess: 'read table'
  });

  grist.onRecord(function(record) {
    const content = document.getElementById('content');
    
    function update_view() {
      content.innerHTML = '';
      
      // Generate QR
      const qrCanvas = generateQRCode(record.Link);
      content.appendChild(qrCanvas);

      // FIX FOR REFERENCE COLUMN:
      // If record.Type is an object (Reference), use grist.renderValue
      // Otherwise, use the raw value.
      const typeText = typeof record.Type === 'object' && record.Type !== null 
                       ? record.Type.label || Object.values(record.Type)[0] 
                       : record.Type;

      const brandText = record.Brand || "";

      // Create Label: Type-Brand
      const label = document.createElement('div');
      label.id = 'label';
      label.innerText = `${typeText}-${brandText}`;
      
      content.appendChild(label);
    }

    window.addEventListener("resize", update_view);
    update_view();
  });
</script>
